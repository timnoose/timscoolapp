<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#101018" />
    <title>He-Erik-Man Quest: Building Edition</title>
    <meta name="description" content="A retro pixel RPG: keep the warehouse church running, win over Clarksville, and finally get Harvest Church Ft. Campbell a building." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="He-Erik-Man Quest: Building Edition" />
    <meta property="og:description" content="A retro pixel RPG: keep the warehouse church running, win over Clarksville, and finally get Harvest Church Ft. Campbell a building. Play in your browser." />
    <meta property="og:image" content="https://timnoose.github.io/timscoolapp/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="He-Erik-Man Quest: Building Edition" />
    <meta name="twitter:image" content="https://timnoose.github.io/timscoolapp/og.png" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23101018'/%3E%3Crect x='4' y='2' width='8' height='7' fill='%23c9a27a'/%3E%3Crect x='4' y='7' width='8' height='4' fill='%23221812'/%3E%3Crect x='3' y='11' width='10' height='4' fill='%2373000a'/%3E%3Crect x='6' y='5' width='1' height='1' fill='%23000'/%3E%3Crect x='9' y='5' width='1' height='1' fill='%23000'/%3E%3C/svg%3E" />
    <style>
      @font-face {
        font-family: 'PressStart';
        src: url('./fonts/PressStart2P.ttf') format('truetype');
        font-display: block;
      }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #101018; color: #eee;
        font-family: 'PressStart', monospace;
        overflow: hidden;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
        overscroll-behavior: none;
      }
      #app {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
      }
      #game { position: relative; flex: 0 0 auto; }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
        margin: 0 auto;
      }
      /* Touch controls */
      #touch {
        display: none;
        position: fixed; left: 0; right: 0; bottom: 0;
        height: 190px;
        pointer-events: none;
        padding-bottom: env(safe-area-inset-bottom);
      }
      body.touch #touch { display: block; }
      .tbtn {
        position: absolute; pointer-events: auto;
        width: 52px; height: 52px;
        background: rgba(255,255,255,0.12);
        border: 2px solid rgba(255,255,255,0.35);
        border-radius: 10px;
        color: #fff; font-size: 12px; line-height: 48px; text-align: center;
        -webkit-tap-highlight-color: transparent;
      }
      .tbtn:active, .tbtn.on { background: rgba(255,255,255,0.35); }
      #t-up { left: 66px; bottom: 120px; }
      #t-down { left: 66px; bottom: 12px; }
      #t-left { left: 12px; bottom: 66px; }
      #t-right { left: 120px; bottom: 66px; }
      #t-a { right: 16px; bottom: 60px; width: 64px; height: 64px; border-radius: 32px; line-height: 60px; font-size: 14px; }
      #t-b { right: 90px; bottom: 24px; width: 56px; height: 56px; border-radius: 28px; line-height: 52px; }
      #t-menu { right: 16px; bottom: 140px; width: 64px; height: 30px; line-height: 26px; font-size: 9px; border-radius: 6px; }
      /* font preload trick */
      #fontload { position: absolute; left: -9999px; top: -9999px; font-family: 'PressStart'; }
  #rotate { display: none; position: absolute; left: 50%; transform: translateX(-50%); top: 260px; width: calc(100% - 28px); padding: 10px 12px; max-width: 360px; box-sizing: border-box; z-index: 5; background: #1a1a2a; border: 2px solid #f4f4f0; border-radius: 8px;
        font-family: 'Press Start 2P', 'PressStart', monospace; font-size: 8px; line-height: 1.7; color: #f4f4f0; text-align: center; pointer-events: auto; }
      #rotate b { color: #ffd27f; }
      #rotate span { display: block; margin-top: 6px; color: #9aa0b8; font-size: 7px; }
      body.touch #rotate.show { display: block; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
      <div id="rotate"><b>&#8635; Tip:</b> turn your phone sideways. The game plays best in landscape.<span>tap to dismiss</span></div>
    </div>
    <div id="touch">
      <div class="tbtn" id="t-up" data-key="up">&#9650;</div>
      <div class="tbtn" id="t-left" data-key="left">&#9664;</div>
      <div class="tbtn" id="t-right" data-key="right">&#9654;</div>
      <div class="tbtn" id="t-down" data-key="down">&#9660;</div>
      <div class="tbtn" id="t-a" data-key="a">A</div>
      <div class="tbtn" id="t-b" data-key="b">B</div>
      <div class="tbtn" id="t-menu" data-key="menu">MENU</div>
    </div>
    <div id="fontload">.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
